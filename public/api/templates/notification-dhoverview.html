<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overview access — {{site_name}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #1c1c1c;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background-color: #f4f4f5; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 600px;
              width: 100%;
              background-color: #ffffff;
              border: 1px solid #e4e4e7;
            "
          >
            <tr>
              <td style="background-color: #18181b; padding: 28px 32px 24px">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 11px;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                    color: #a1a1aa;
                    font-weight: 600;
                  "
                >
                  Overview access
                </p>
                <h1 style="margin: 0; font-size: 24px; font-weight: 600; color: #ffffff">
                  {{first}} {{last}}
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 32px 28px">
                <p style="margin: 20px 0 0; font-size: 15px; line-height: 1.6; color: #52525b">
                  Someone requested access on
                  <a
                    href="{{site_url}}"
                    style="color: #18181b; text-decoration: none; font-weight: 600"
                    >{{site_url}}</a
                  >.
                </p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="padding: 14px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 11px;
                          letter-spacing: 1px;
                          text-transform: uppercase;
                          color: #71717a;
                        "
                        >Email</strong
                      >
                      <a href="mailto:{{email_raw}}" style="color: #18181b; font-size: 16px"
                        >{{email}}</a
                      >
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 11px;
                          letter-spacing: 1px;
                          text-transform: uppercase;
                          color: #71717a;
                        "
                        >Phone</strong
                      >
                      <span style="font-size: 16px">{{phone}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 11px;
                          letter-spacing: 1px;
                          text-transform: uppercase;
                          color: #71717a;
                        "
                        >Company</strong
                      >
                      <span style="font-size: 16px">{{company}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 11px;
                          letter-spacing: 1px;
                          text-transform: uppercase;
                          color: #71717a;
                        "
                        >IP address</strong
                      >
                      <span style="font-size: 16px">{{ip}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 0">
                      <strong
                        style="
                          display: block;
                          font-size: 11px;
                          letter-spacing: 1px;
                          text-transform: uppercase;
                          color: #71717a;
                        "
                        >Submitted</strong
                      >
                      <span style="font-size: 16px">{{submitted_at}}</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
