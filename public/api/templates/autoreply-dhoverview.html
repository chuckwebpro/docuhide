<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your access link — {{site_name}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #1c1c1c;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background-color: #f4f4f5; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 600px;
              width: 100%;
              background-color: #ffffff;
              border: 1px solid #e4e4e7;
            "
          >
            <tr>
              <td style="background-color: #18181b; padding: 28px 32px 24px">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 11px;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                    color: #a1a1aa;
                    font-weight: 600;
                  "
                >
                  {{site_name}}
                </p>
                <h1 style="margin: 0; font-size: 24px; font-weight: 600; color: #ffffff">
                  Your access link
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6">Hello {{name}},</p>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.6">
                  Use the link below to open the overview. It works one time and expires on
                  {{expires}}.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{page_url}}"
                    style="
                      display: inline-block;
                      background-color: #daf34f;
                      color: #06121f;
                      font-size: 16px;
                      font-weight: 700;
                      text-decoration: none;
                      padding: 12px 20px;
                    "
                    >Open overview</a
                  >
                </p>
                <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.6; color: #52525b">
                  Or copy this address into your browser:<br />
                  <a href="{{page_url}}" style="color: #18181b; word-break: break-all"
                    >{{page_url}}</a
                  >
                </p>
                <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #52525b">
                  — The {{site_name}} team
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
